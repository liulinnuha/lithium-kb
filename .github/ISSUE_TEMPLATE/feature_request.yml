name: Feature request
description: Suggest an idea or new language support for agent-kb
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thank you for suggesting a feature!
  - type: textarea
    id: feature-description
    attributes:
      label: Is your feature request related to a problem or new language?
      description: A clear and concise description of what you want to achieve.
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Describe the solution you'd like
      description: How should this feature work in the CLI, MCP server, or Neural UI?
    validations:
      required: true
